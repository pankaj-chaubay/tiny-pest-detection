[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinypest"
version = "1.0.0"
description = "Tiny insect pest detection on IP102: VOC to COCO, anchor analysis, small-anchor Faster/Mask R-CNN, NMS and Soft-NMS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pankaj Chaubay" }]
dependencies = [
    "torch>=2.5",
    "torchvision>=0.21",
    "pycocotools>=2.0.7",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
tinypest = "tinypest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinypest = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:pycocotools.*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = false
files = ["src"]

[[tool.mypy.overrides]]
module = ["pycocotools.*", "torchvision.*", "matplotlib.*"]
ignore_missing_imports = true
